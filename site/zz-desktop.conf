server {
    server_name yunzhao-desktop.com www.yunzhao-desktop.com;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:3003;
        include /etc/nginx/proxy_params;
    }

    location /items {
        proxy_pass http://127.0.0.1:3003;
        include /etc/nginx/proxy_params;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3003;
        include /etc/nginx/proxy_params;
    }

    location = /releases/latest.json {
        alias /var/www/yunzhao-desktop/releases/latest.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    location /releases/ {
        alias /var/www/yunzhao-desktop/releases/;
        types { application/zip zip; }
        default_type application/octet-stream;
    }

    location / {
        root /var/www/yunzhao-desktop;
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/yunzhao-desktop.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/yunzhao-desktop.com/privkey.pem; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    # The shared Certbot file also turns on TLS 1.3. Windows then reports a
    # renegotiation and the .NET updater aborts the handshake. TLS 1.2 does not.
    ssl_session_cache shared:le_nginx_SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
}

server {
    if ($host = www.yunzhao-desktop.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = yunzhao-desktop.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name yunzhao-desktop.com www.yunzhao-desktop.com;
    return 404; # managed by Certbot
}
