<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>当日待办</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f6f6f8; color: #1d1d1f; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    body { display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 8px; padding: 16px 16px 8px; }
    header b { flex: 1; font-size: 18px; }
    button { height: 32px; border: 0; border-radius: 8px; padding: 0 12px; background: #f2f2f7; color: #1d1d1f; font: inherit; cursor: pointer; }
    button:hover { background: #e5e5ea; }
    button:active { background: #d1d1d6; transform: scale(0.97); }
    button.primary { background: #0a84ff; color: #fff; }
    button.primary:hover { background: #0070e0; }
    ul { list-style: none; margin: 0; padding: 8px 12px 16px; overflow: auto; flex: 1; }
    li { margin: 6px 0; padding: 10px 12px; border-radius: 10px; background: #fff; cursor: pointer; }
    li:hover { background: #eef6ff; }
    li.done { color: #aeaeb2; text-decoration: line-through; }
    .empty { margin: 24px 16px; color: #8e8e93; }
  </style>
</head>
<body>
  <header>
    <b id="title">当日待办</b>
    <button id="create" class="primary" type="button">新建待办</button>
    <button id="close" type="button">关闭</button>
  </header>
  <ul id="list"></ul>
  <script>
    let dateKey = ''
    function paint(data) {
      dateKey = data?.dateKey || ''
      document.getElementById('title').textContent = data?.title || '当日待办'
      const list = document.getElementById('list')
      list.innerHTML = ''
      const notes = Array.isArray(data?.notes) ? data.notes : []
      if (!notes.length) {
        const empty = document.createElement('p')
        empty.className = 'empty'
        empty.textContent = '这一天还没有待办'
        list.appendChild(empty)
        return
      }
      for (const note of notes) {
        const item = document.createElement('li')
        item.className = note.done ? 'done' : ''
        item.textContent = note.content || '未命名待办'
        item.onclick = () => window.api.yunzhaoDayEdit?.(note.id)
        list.appendChild(item)
      }
    }
    document.getElementById('create').onclick = () => window.api.yunzhaoDayCreate?.(dateKey)
    document.getElementById('close').onclick = () => window.close()
    window.api.onYunzhaoDayData?.(paint)
  </script>
</body>
</html>
