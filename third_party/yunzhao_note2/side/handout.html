<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>课堂讲义</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; color: #1d1d1f; font-family: "OPPOSans", "Segoe UI", "Microsoft YaHei", sans-serif; }
    body { display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 16px; border-bottom: 1px solid rgba(29, 29, 31, 0.08); -webkit-app-region: drag; }
    header b { flex: 1; font-size: 16px; font-weight: 700; }
    button { height: 32px; border: 0; border-radius: 8px; padding: 0 12px; background: #f2f2f7; color: inherit; font: inherit; font-size: 14px; cursor: pointer; -webkit-app-region: no-drag; }
    button:hover { background: #e5e5ea; }
    button:active { background: #d1d1d6; }
    button.primary { background: #0a84ff; color: #fff; }
    button.primary:hover { background: #0070e0; }
    button.primary:active { background: #0060c0; }
    #body { flex: 1; min-height: 0; overflow: auto; padding: 18px 22px 28px; outline: none; font-size: 16px; line-height: 1.7; }
    #body img { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <header>
    <b id="title">课堂讲义</b>
    <button id="image" type="button">插入图片</button>
    <button id="done" class="primary" type="button">完成</button>
  </header>
  <div id="body" contenteditable="true"></div>
  <input id="file" type="file" accept="image/*" hidden />
  <script>
    let key = ''
    let timer = 0
    function save() {
      if (!key) return
      window.api.atriumHandoutPiece?.(key, document.getElementById('body').innerHTML)
    }
    function load(data) {
      key = data?.key || ''
      document.getElementById('title').textContent = (data?.title || '课堂讲义') + ' 课堂讲义'
      document.getElementById('body').innerHTML = data?.html || ''
    }
    document.getElementById('body').addEventListener('input', () => {
      clearTimeout(timer)
      timer = setTimeout(save, 400)
    })
    document.getElementById('image').onclick = () => document.getElementById('file').click()
    document.getElementById('file').onchange = (event) => {
      const file = event.target.files && event.target.files[0]
      event.target.value = ''
      if (!file) return
      const reader = new FileReader()
      reader.onload = () => {
        document.getElementById('body').focus()
        document.execCommand('insertImage', false, String(reader.result || ''))
        save()
      }
      reader.readAsDataURL(file)
    }
    document.getElementById('done').onclick = () => {
      save()
      window.close()
    }
    window.api.onAtriumHandoutData?.(load)
  </script>
</body>
</html>
